<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Chi Tiêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an ink "receipt printer" band for quick entry on top; the month's ledger
   (summary, calendar, transactions) on the left; envelopes and insights on a right rail.
   Stacks to one column under 960px. */
:root {
  --page: #eceef2;
  --paper: #fbfcfd;
  --paper-2: #f2f4f7;
  --ink: #161b28;
  --ink-2: #4a5163;
  --muted: #747b8b;
  --rule: #dde1e8;
  --rule-strong: #c4cad5;
  --marker: rgba(255, 210, 0, .5);
  --flash: rgba(255, 210, 0, .28);
  --band-scheme: dark; --band-err: #ffb4b4;
  --good: #0ca30c; --good-text: #006300;
  --warn: #fab219; --warn-text: #8a5a00;
  --crit: #d03b3b; --crit-text: #b42323;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --h1: #cde2fb; --h2: #9ec5f4; --h3: #6da7ec; --h4: #3987e5; --h5: #1c5cab;
  --h-lo-fg: #161b28; --h-hi-fg: #ffffff;
  --shadow: 0 1px 0 rgba(22, 27, 40, .04), 0 12px 32px -18px rgba(22, 27, 40, .28);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1218; --paper: #181c25; --paper-2: #1f2430;
    --ink: #e8ebf2; --ink-2: #b4bac8; --muted: #8a91a1;
    --rule: #2a303d; --rule-strong: #3a4252;
    --marker: rgba(255, 210, 0, .3); --flash: rgba(255, 210, 0, .16);
    --band-scheme: light; --band-err: #b42323;
    --good-text: #3ec43e; --warn-text: #fab219; --crit-text: #ef6b6b;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --h1: #173257; --h2: #1c5cab; --h3: #2a78d6; --h4: #5598e7; --h5: #9ec5f4;
    --h-lo-fg: #e8ebf2; --h-hi-fg: #0f1218;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 16px 36px -20px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f1218; --paper: #181c25; --paper-2: #1f2430;
  --ink: #e8ebf2; --ink-2: #b4bac8; --muted: #8a91a1;
  --rule: #2a303d; --rule-strong: #3a4252;
  --marker: rgba(255, 210, 0, .3); --flash: rgba(255, 210, 0, .16);
  --band-scheme: light; --band-err: #b42323;
  --good-text: #3ec43e; --warn-text: #fab219; --crit-text: #ef6b6b;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --h1: #173257; --h2: #1c5cab; --h3: #2a78d6; --h4: #5598e7; --h5: #9ec5f4;
  --h-lo-fg: #e8ebf2; --h-hi-fg: #0f1218;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 16px 36px -20px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--page); color: var(--ink); }
body { margin: 0; font: 14.5px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.mono, .num { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 48px; display: flex; flex-direction: column; gap: 18px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 30px; height: 30px; }
.brand .word { font: 800 26px/1 var(--font-display); letter-spacing: -.02em; }
.brand .tag { font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.month-nav { display: flex; align-items: center; gap: 4px; }
.month-nav h1 { font-size: 20px; font-weight: 700; min-width: 12.5ch; text-align: center; letter-spacing: -.01em; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--paper); font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--paper-2); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.btn { border: 1px solid var(--rule-strong); background: var(--paper); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { background: var(--paper-2); }
.btn.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.solid:hover { opacity: .9; }
.btn.danger { color: var(--crit-text); border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.btn svg { width: 16px; height: 16px; }
.link { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; font-weight: 600; }
.link:hover { color: var(--ink); }

/* ---------- banner ---------- */
.banner { display: flex; gap: 12px 18px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-radius: var(--r); border: 1px dashed var(--rule-strong); background: var(--paper); font-size: 14px; color: var(--ink-2); }
.banner b { color: var(--ink); }
.banner .stamp { font: 600 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--paper); background: var(--ink-2); padding: 5px 8px; border-radius: 4px; }
.banner .grow { flex: 1 1 260px; min-width: 0; }

/* ---------- the printer band (quick add) ---------- */
.slot { background: var(--ink); color: var(--paper); border-radius: 16px; padding: 18px 20px 16px; color-scheme: var(--band-scheme); position: relative; }
.slot-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.slot-head h2 { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.slot-head .hint { font-size: 12.5px; opacity: .7; }
.slot-head kbd { font: 500 11px/1 var(--font-mono); border: 1px solid color-mix(in srgb, var(--paper) 35%, transparent); border-radius: 4px; padding: 2px 5px; }
.feed { display: flex; gap: 10px; align-items: stretch; }
.feed-input { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--paper); color: var(--ink); border-radius: 10px; padding: 0 14px; box-shadow: inset 0 2px 0 rgba(0,0,0,.06); }
.feed-input span { font: 600 20px/1 var(--font-mono); color: var(--muted); }
#quick { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 14px 0; font: 500 18px/1.2 var(--font-mono); color: var(--ink); }
#quick::placeholder { color: var(--muted); opacity: .8; }
.feed-input:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--paper) 40%, transparent); }
.feed .btn.add { background: var(--paper); color: var(--ink); border: 0; border-radius: 10px; padding: 0 20px; font-size: 15px; }
.feed .btn.add:hover { opacity: .9; }
.parsed { margin-top: 12px; display: grid; grid-template-columns: minmax(90px, 130px) minmax(130px, 190px) minmax(130px, 170px) minmax(120px, 1fr) auto; gap: 8px; align-items: end; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label { font: 500 10.5px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
.fld input, .fld select { width: 100%; min-width: 0; background: color-mix(in srgb, var(--paper) 9%, transparent); border: 1px solid color-mix(in srgb, var(--paper) 22%, transparent); border-radius: 8px; padding: 7px 9px; font-size: 14px; color: var(--paper); }
.fld select option { color: var(--ink); background: var(--paper); }
.fld input.amt { font-family: var(--font-mono); font-weight: 600; }
.fld.auto input, .fld.auto select { border-color: color-mix(in srgb, var(--paper) 45%, transparent); }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; padding-bottom: 8px; }
.chk input { width: 16px; height: 16px; accent-color: var(--paper); }
.slot-foot { margin-top: 10px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; font-size: 13px; min-height: 22px; }
.slot-foot .msg { opacity: .8; }
.slot-foot .msg.err { opacity: 1; color: var(--band-err); font-weight: 600; }
.slot-foot .edit-actions { display: flex; gap: 8px; margin-left: auto; }
.slot-foot .edit-actions .btn { padding: 5px 12px; font-size: 13px; background: transparent; color: var(--paper); border-color: color-mix(in srgb, var(--paper) 35%, transparent); }
.slot.editing { outline: 3px solid var(--marker); outline-offset: 3px; }

/* ---------- grid + panels ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -.005em; }
.eyebrow { font: 500 10.5px/1.2 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--ink-2); font-size: 13.5px; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

/* summary */
.hero { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; }
.hero-num { font: 700 clamp(40px, 6vw, 58px)/1 var(--font-display); letter-spacing: -.035em; margin-top: 6px; display: inline-block; padding: 0 4px; margin-left: -4px;
  background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 88%, transparent 88%); }
.delta { font-size: 14px; color: var(--ink-2); margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.delta .arrow { font-weight: 700; }
.delta.good .arrow, .delta.good b { color: var(--good-text); }
.delta.bad .arrow, .delta.bad b { color: var(--crit-text); }
.pace { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); gap: 4px 22px; }
.pace dt { font: 500 10.5px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pace dd { margin: 3px 0 0; font: 600 18px/1.2 var(--font-display); }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--font-body); padding: 4px 9px 4px 7px; border-radius: 999px; border: 1px solid var(--rule-strong); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip.good i { background: var(--good); } .chip.good { color: var(--good-text); }
.chip.warn i { background: var(--warn); } .chip.warn { color: var(--warn-text); }
.chip.crit i { background: var(--crit); } .chip.crit { color: var(--crit-text); }
.chip.plain { color: var(--ink-2); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin: 16px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ln { width: 16px; height: 2px; border-radius: 2px; display: inline-block; }
.chart { position: relative; width: 100%; height: 220px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { font: 500 11px var(--font-mono); fill: var(--muted); }
.chart .endlbl { font: 600 12px var(--font-mono); fill: var(--ink); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal .dow { font: 500 10.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 4px; }
.day { aspect-ratio: 1.35; max-width: 100%; border-radius: 7px; border: 0; background: var(--paper-2); color: var(--ink-2); position: relative; padding: 5px 6px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; min-width: 0; }
.day .d { font: 600 11.5px/1 var(--font-mono); }
.day .v { font: 500 10.5px/1 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
.day.l1 { background: var(--h1); color: var(--h-lo-fg); } .day.l2 { background: var(--h2); color: var(--h-lo-fg); } .day.l3 { background: var(--h3); color: var(--h-lo-fg); }
.day.l4 { background: var(--h4); color: var(--h-hi-fg); } .day.l5 { background: var(--h5); color: var(--h-hi-fg); }
.day.future { opacity: .4; cursor: default; }
.day.today { box-shadow: 0 0 0 2px var(--ink); }
.day.sel { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--c1); }
.day.nospend .v { color: var(--good-text); font-weight: 600; }
.day.pad { visibility: hidden; }
.day:not(.future):not(.pad):hover { filter: brightness(.96); }
.cal-foot { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.ramp { display: inline-flex; align-items: center; gap: 3px; font: 500 11px var(--font-mono); color: var(--muted); }
.ramp i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }

/* ledger */
.ledger-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--rule-strong); border-radius: 999px; padding: 4px 12px; background: var(--paper); min-width: 0; }
.search input { border: 0; outline: 0; background: transparent; width: 15ch; min-width: 0; font-size: 14px; }
.daygroup + .daygroup { margin-top: 14px; }
.dayhead { display: flex; justify-content: space-between; gap: 10px; font: 500 11px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 0 6px; border-bottom: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 9px 4px; border-radius: 0; }
.row:hover { background: var(--paper-2); }
.row .note { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.row .meta { grid-column: 1; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.row .amt { grid-row: 1 / span 2; grid-column: 2; font: 600 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.tagpill { font: 600 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--rule-strong); border-radius: 4px; padding: 3px 5px; color: var(--ink-2); }
.row.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { background: var(--flash); } 100% { background: transparent; } }

/* envelopes */
.env { display: flex; flex-direction: column; gap: 13px; }
.env-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; }
.env-name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; min-width: 0; }
.env-val { font: 500 12.5px var(--font-mono); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.meter { grid-column: 1 / -1; height: 8px; background: var(--paper-2); border-radius: 4px; overflow: hidden; position: relative; }
.meter b { display: block; height: 100%; border-radius: 4px; background: var(--ink-2); }
.meter b.warn { background: var(--warn); }
.meter b.crit { background: var(--crit); }
.meter .pacemark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
.env-note { grid-column: 1 / -1; font-size: 12px; }
.env-note.warn { color: var(--warn-text); } .env-note.crit { color: var(--crit-text); }
.env-total { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }

/* radar */
.radar-list { display: flex; flex-direction: column; }
.radar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.radar-row:last-child { border-bottom: 0; }
.radar-row .n { font-weight: 600; font-size: 14px; display: flex; gap: 7px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.radar-row .a { font: 600 13.5px var(--font-mono); text-align: right; }
.radar-row .w { font-size: 12px; color: var(--muted); }
.radar-row .y { font: 500 12px var(--font-mono); color: var(--muted); text-align: right; }
.bigline { font: 700 26px/1.1 var(--font-display); letter-spacing: -.02em; }

/* wallet */
.wallet-in { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.wallet-in label { flex-basis: 100%; font-size: 13px; color: var(--ink-2); }
.wallet-in input { flex: 1; min-width: 0; border: 1px solid var(--rule-strong); border-radius: 8px; padding: 7px 9px; background: var(--paper); font-family: var(--font-mono); font-weight: 600; }
.wallet-in .btn { padding: 6px 14px; }
.wallet .eyebrow { margin-top: 16px; }
.big-num { font: 800 36px/1 var(--font-display); letter-spacing: -.03em; margin: 4px 0 12px; overflow-wrap: anywhere; }
.big-num.over { color: var(--crit-text); }
.traits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.traits div { border-top: 1px solid var(--rule); padding-top: 8px; min-width: 0; }
.traits dt { font: 500 10px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.traits dd { margin: 4px 0 0; font: 600 15px/1.2 var(--font-display); overflow-wrap: anywhere; }
.wallet .traits { margin-top: 12px; }
.fine { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* footer */
.foot { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); padding-top: 4px; }
.foot .store { display: inline-flex; align-items: center; gap: 7px; }
.foot .keys { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); }
.foot kbd { font: 500 11px/1 var(--font-mono); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 2px 5px; color: var(--ink-2); }
.foot .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* tooltip + toast */
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: var(--shadow); max-width: 240px; }
#tip b { font-family: var(--font-mono); }
#tip .k { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 6px; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 9px 10px 9px 18px; display: flex; gap: 14px; align-items: center; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
#toast button { background: transparent; color: var(--paper); border: 1px solid color-mix(in srgb, var(--paper) 40%, transparent); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px; }

/* modal + receipt */
.overlay { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--page) 55%, rgba(8, 10, 16, .55)); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 40px; }
.sheet { background: var(--paper); border-radius: 16px; border: 1px solid var(--rule); width: min(560px, 100%); padding: 20px 22px; box-shadow: var(--shadow); }
.sheet h2 { font-size: 20px; margin-bottom: 4px; }

          mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--tooth) * 2) var(--tooth) repeat-x, linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat;

<script>
"use strict";
document.documentElement.lang = "vi";

/* ================= constants ================= */
const CATS = [
  { key: "food", name: "Ăn uống" },
  { key: "groceries", name: "Đi chợ" },
  { key: "transport", name: "Đi lại" },
  { key: "home", name: "Nhà & hóa đơn" },
  { key: "shopping", name: "Mua sắm" },
  { key: "health", name: "Sức khỏe" },
  { key: "fun", name: "Giải trí & du lịch" },
  { key: "other", name: "Khác" },
];
const CAT = Object.fromEntries(CATS.map((c, i) => [c.key, { ...c, color: `var(--c${i + 1})` }]));
// stored in hundredths of the currency unit; for VND that's đồng × 100
const DEFAULT_BUDGETS = { food: 450000000, groceries: 350000000, transport: 150000000, home: 900000000, shopping: 200000000, health: 100000000, fun: 150000000, other: 80000000 };
const SETTINGS_VERSION = 2;
const CURRENCIES = ["VND", "USD", "EUR", "JPY", "KRW", "SGD", "AUD", "GBP"];
const ZERO_DEC = new Set(["VND", "JPY", "KRW"]);
const LOCALE = "vi-VN";
const WD = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];

// keywords are written without diacritics so "ca phe" and "cà phê" both match
const KEYWORDS = {
  food: "ca phe, cafe, coffee, latte, tra sua, tra da, tra chanh, sinh to, nuoc ep, banh mi, pho, bun, bun cha, bun bo, com, com tam, com trua, com ga, mi, mi quang, hu tieu, chao, lau, nuong, an trua, an toi, an sang, an vat, quan an, nha hang, highlands, phuc long, starbucks, the coffee house, pizza, ga ran, kfc, lotteria, jollibee, bia, nhau, banh, che, xoi, oc, hai san, grabfood, shopeefood, buffet, banh xeo, goi cuon, kem, lunch, dinner, breakfast, sushi",
  groceries: "di cho, sieu thi, bach hoa xanh, bach hoa, coopmart, co op, winmart, vinmart, lotte mart, aeon, big c, thit, ca, rau, trai cay, trung, gao, nuoc mam, thuc pham, grocery, groceries",
  transport: "grab, gojek, xanh sm, taxi, xang, do xang, gui xe, ve xe, xe buyt, xe bus, ve tau, metro, sua xe, rua xe, thay nhot, bao duong, phi duong, uber, parking",
  home: "tien nha, thue nha, tien dien, dien, tien nuoc, internet, wifi, cap quang, dien thoai, cuoc dien thoai, phi quan ly, chung cu, gas, binh gas, tien rac, hoa don, bao hiem, sua nha, giup viec, rent",
  shopping: "shopee, lazada, tiki, tiktok shop, quan ao, ao, giay, dep, tui, my pham, son, nuoc hoa, qua, qua tang, sinh nhat, do gia dung, noi that, dien may, tai nghe, sach, uniqlo, zara, ikea, amazon",
  health: "thuoc, nha thuoc, bac si, kham, kham benh, benh vien, phong kham, nha khoa, rang, gym, phong gym, yoga, vitamin, kinh, cat toc, spa, massage, bao hiem y te",
  fun: "netflix, spotify, youtube, phim, xem phim, ve xem phim, rap, cgv, karaoke, game, steam, concert, ve, du lich, khach san, homestay, airbnb, may bay, ve may bay, bowling, bao tang, cong vien, choi",
};

/* ================= small utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const mkDate = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m - 1, 1); };
const shiftMonth = (mk, n) => { const d = mkDate(mk); d.setMonth(d.getMonth() + n); return monthKey(d); };
const dim = mk => { const d = mkDate(mk); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const uid = () => "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cap = s => s ? s[0].toLocaleUpperCase(LOCALE) + s.slice(1) : s;
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + f(x), 0);
// strip Vietnamese tone marks character by character, so the folded string keeps the same length and indexes
function fold(s) {
  let o = "";
  for (const ch of String(s ?? "")) {
    let b = ch === "đ" || ch === "Đ" ? "d" : ch.normalize("NFD").replace(/[̀-ͯ]/g, "");
    b = b.toLowerCase();
    o += b.length === ch.length ? b : ch;
  }
  return o;
}
const norm = s => fold(s).replace(/[^a-z ]+/g, " ").replace(/\s+/g, " ").trim();
const KW = {};
for (const [k, list] of Object.entries(KEYWORDS)) for (const w of list.split(",")) KW[norm(w)] = k;

/* ---- dates and money in Vietnamese ---- */
const monthLabel = mk => { const d = mkDate(mk); return `Tháng ${d.getMonth() + 1}/${d.getFullYear()}`; };
const monthWord = mk => `tháng ${mkDate(mk).getMonth() + 1}`;
const dayLabel = d => `${WD[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1}`;
const shortDate = d => `${d.getDate()}/${d.getMonth() + 1}`;
const zeroDec = () => ZERO_DEC.has(S.settings.currency || "VND");

function compactVND(v) {
  const a = Math.abs(v), sg = v < 0 ? "-" : "";
  const one = x => (Math.round(x * 10) / 10).toLocaleString(LOCALE);
  if (a >= 1e9) return sg + one(a / 1e9) + " tỷ";
  if (a >= 1e6) return sg + one(a / 1e6) + "tr";
  if (a >= 1e3) return sg + Math.round(a / 1e3) + "k";
  return sg + Math.round(a) + "đ";
}
const fmtCache = {};
function money(cents, { compact = false } = {}) {
  const cur = S.settings.currency || "VND";
  if (compact && cur === "VND") return compactVND(cents / 100);
  const key = cur + compact;
  if (!fmtCache[key]) {
    try { fmtCache[key] = new Intl.NumberFormat(LOCALE, { style: "currency", currency: cur, notation: compact ? "compact" : "standard", maximumFractionDigits: compact ? 1 : undefined }); }
    catch { fmtCache[key] = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "VND" }); }
  }
  return fmtCache[key].format(cents / 100);
}
const wholeMoney = c => {
  if (zeroDec()) return money(c);
  try { return new Intl.NumberFormat(LOCALE, { style: "currency", currency: S.settings.currency, maximumFractionDigits: 0 }).format(Math.round(c / 100)); }
  catch { return money(c); }
};
const amountToField = c => zeroDec() ? Math.round(c / 100).toLocaleString(LOCALE) : (c / 100).toFixed(2);
// thresholds that only make sense in local terms
const PACE_MIN = () => ({ VND: 500000, JPY: 3000, KRW: 30000 }[S.settings.currency] ?? 20) * 100;

/* ================= natural-language parser ================= */
const UNIT = { k: 1e3, nghin: 1e3, ngan: 1e3, tr: 1e6, trieu: 1e6, cu: 1e6, ty: 1e9 };
const AMOUNT_RE = /(^|\s)([$€£¥₩]\s?)?(\d+(?:[.,]\d+)*)\s?(?:(k|nghin|ngan|tr|trieu|cu|ty)(\d{1,3})?)?\s?(d|vnd|dong|usd|\$)?(?=\s|$)/g;

// finds every amount in a folded string: "45k", "45.000đ", "1tr5", "2 triệu", "4.50"
function findAmounts(f, guessK) {
  const out = [];
  const re = new RegExp(AMOUNT_RE.source, "g");
  let m;
  while ((m = re.exec(f))) {
    const [, lead, mark, numStr, unit, tail, suffix] = m;
    let v, grouped = false;
    if (/^\d{1,3}(?:[.,]\d{3})+$/.test(numStr)) { v = Number(numStr.replace(/[.,]/g, "")); grouped = true; }
    else if (/^\d+[.,]\d+$/.test(numStr)) v = Number(numStr.replace(",", "."));
    else v = Number(numStr.replace(/[.,]/g, ""));
    if (unit) { const u = UNIT[unit]; v *= u; if (tail) v += Number(tail) * u / Math.pow(10, tail.length); }
    let guessed = false;
    // in Vietnam "cà phê 45" means 45.000đ; nothing costs 45 đồng
    if (guessK && !unit && !grouped && v < 1000 && S.settings.currency === "VND") { v *= 1000; guessed = true; }
    out.push({ cents: Math.round(v * 100), strong: !!(unit || mark || suffix || grouped), guessed, idx: m.index + lead.length, len: m[0].length - lead.length });
  }
  return out;
}
const pickAmount = nums => nums.find(n => n.strong) || (nums.length ? nums.reduce((a, b) => (b.cents > a.cents ? b : a)) : null);
function parseAmount(str, guessK = true) {
  const p = pickAmount(findAmounts(" " + fold(String(str || "").normalize("NFC")) + " ", guessK));
  return p && p.cents > 0 ? p.cents : null;
}

const VI_DOW = { hai: 1, 2: 1, ba: 2, 3: 2, tu: 3, 4: 3, nam: 4, 5: 4, sau: 5, 6: 5, bay: 6, 7: 6 };
const CONNECTORS = new Set(["luc", "o", "tai", "vao", "ngay", "on", "at", "for", "-", "–", ":"]);

function parseQuick(raw, now = today(), history = []) {
  let s = " " + String(raw).normalize("NFC") + " ";
  let f = fold(s);
  const out = { amount: null, guessed: false, date: null, cat: null, catAuto: false, note: "", recurring: false };
  const blank = (a, b) => { const sp = " ".repeat(b - a); s = s.slice(0, a) + sp + s.slice(b); f = f.slice(0, a) + sp + f.slice(b); };
  const cut = (re, fn, all = false) => {
    const rg = new RegExp(re.source, re.flags.replace("g", "") + "g");
    let m;
    while ((m = rg.exec(f))) { fn(m); blank(m.index, m.index + m[0].length); if (!all) break; }
  };
  const notFuture = d => { if (d > now) d.setFullYear(d.getFullYear() - 1); return d; };

  cut(/\b(hang thang|moi thang|thang nao cung|dinh ky|monthly|every month)\b|\/thang\b|\/mo\b/i, () => { out.recurring = true; }, true);
  cut(/\b(hom nay|toi nay|sang nay|trua nay|chieu nay|dem nay|today|tonight)\b/i, () => { out.date = now; });
  cut(/\b(hom qua|toi qua|dem qua|trua qua|sang qua|chieu qua|yesterday)\b/i, () => { out.date = addDays(now, -1); });
  cut(/\bhom kia\b/i, () => { out.date = addDays(now, -2); });
  cut(/\b(\d{1,2})\s*(?:ngay\s*truoc|days?\s*ago)\b/i, m => { out.date = addDays(now, -Number(m[1])); });
  cut(/\b(\d{4})-(\d{2})-(\d{2})\b/, m => { out.date = new Date(+m[1], +m[2] - 1, +m[3]); });
  cut(/\bngay\s+(\d{1,2})\s+thang\s+(\d{1,2})\b/i, m => { out.date = notFuture(new Date(now.getFullYear(), +m[2] - 1, +m[1])); });
  // Vietnamese dates are day/month
  cut(/\b(?:ngay\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/, m => {
    let y = m[3] ? +m[3] : now.getFullYear(); if (y < 100) y += 2000;
    const d = new Date(y, +m[2] - 1, +m[1]); out.date = m[3] ? d : notFuture(d);
  });
  cut(/\b(?:vao\s+)?(?:thu\s*(hai|ba|tu|nam|sau|bay|[2-7])|t([2-7])|(chu\s*nhat|cn))\b(\s+tuan\s+truoc)?/i, m => {
    const target = m[3] ? 0 : VI_DOW[(m[1] || m[2]).toLowerCase()];
    if (m[4]) { // "thứ 6 tuần trước": that day in last Monday-to-Sunday week
      const monday = addDays(now, -((now.getDay() + 6) % 7));
      out.date = addDays(monday, -7 + (target + 6) % 7);
    } else out.date = addDays(now, -((now.getDay() - target + 7) % 7));
  });

  cut(/(?:^|\s)[#@]([a-z&-]+)/i, m => {
    const t = m[1].toLowerCase();
    if (t.length < 2) return;
    const hit = cats().find(c => [c.name, catName(c.key)].some(nm => [...(c.custom ? [] : [c.key]), norm(nm).replace(/ /g, ""), ...norm(nm).split(" ").filter(w => w.length > 1)].some(w => w.startsWith(t))));
    out.cat = hit ? hit.key : KW[t] || null;
  });

  const nums = findAmounts(f, true), pick = pickAmount(nums);
  if (pick) { out.amount = pick.cents; out.guessed = pick.guessed; blank(pick.idx, pick.idx + pick.len); }

  const toks = s.trim().split(/\s+/).filter(Boolean);
  while (toks.length && CONNECTORS.has(fold(toks[0]))) toks.shift();
  while (toks.length && CONNECTORS.has(fold(toks[toks.length - 1]))) toks.pop();
  const note = toks.join(" ");
  out.note = cap(note);

  if (!out.cat && note) {
    const n = norm(note);
    const past = history.find(e => norm(e.note) === n);
    if (past) out.cat = past.cat;
    else {
      const w = n.split(" ");
      for (let i = 0; i < w.length && !out.cat; i++) {
        for (const len of [3, 2, 1]) {
          const phrase = w.slice(i, i + len).join(" ");
          if (w.length - i >= len && (KW[phrase] || KW[phrase.replace(/s$/, "")])) { out.cat = KW[phrase] || KW[phrase.replace(/s$/, "")]; break; }
        }
      }
    }
    if (out.cat && !catInfo(out.cat)) out.cat = null;
    if (out.cat) out.catAuto = true;
  }
  if (out.cat && !catInfo(out.cat)) out.cat = null;
  out.date = out.date ? ymd(out.date) : null;
  return out;
}

/* ================= sample ledger (shown only until you add your own) ================= */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildSample() {
  const r = rng(20261002), end = today(), out = [];
  const k = (a, b) => Math.round(a + r() * (b - a)) * 1000 * 100; // a random price between a and b thousand đồng
  const pick = arr => arr[Math.floor(r() * arr.length)];
  const add = (d, cents, note, cat, recurring = false) => out.push({ id: "s" + out.length, amount: cents, note, cat, date: ymd(d), recurring, sample: true });
  let groceryIn = 2, gasIn = 4;
  for (let i = 100; i >= 0; i--) {
    const d = addDays(end, -i), dom = d.getDate(), dow = d.getDay(), weekend = dow === 0 || dow === 6;
    if (dom === 1) add(d, 650000000, "Tiền nhà", "home", true);
    if (dom === 3) add(d, 50000000, "Phòng gym", "health", true);
    if (dom === 7) add(d, 26000000, "Netflix", "fun", true);
    if (dom === 12) add(d, k(620, 1080), "Tiền điện", "home", true);
    if (dom === 18) add(d, 23000000, "Internet", "home", true);
    if (dom === 22) add(d, 5900000, "Spotify", "fun", true);
    if (dom === 26) add(d, 4500000, "iCloud", "other", true);
    if (r() < 0.13) continue; // a quiet day
    if (!weekend && r() < 0.62) add(d, k(25, 45), pick(["Cà phê sữa đá", "Cà phê sữa đá", "Bạc xỉu"]), "food");
    if (!weekend && r() < 0.34) add(d, k(35, 70), pick(["Cơm tấm", "Phở", "Bún chả", "Bánh mì", "Cơm văn phòng"]), "food");
    if (weekend && r() < 0.62) add(d, k(250, 700), pick(["Lẩu với bạn", "Ăn tối ngoài", "Nướng cuối tuần", "Hải sản"]), "food");
    if (--groceryIn <= 0) { add(d, k(250, 780), pick(["Đi chợ", "Siêu thị", "Đi chợ"]), "groceries"); groceryIn = 3 + Math.floor(r() * 3); }
    if (--gasIn <= 0) { add(d, k(70, 120), "Đổ xăng", "transport"); gasIn = 6 + Math.floor(r() * 4); }
    if (r() < 0.11) add(d, k(30, 120), "Grab", "transport");
    if (r() < 0.09) add(d, k(120, 900), pick(["Đơn Shopee", "Giày mới", "Đèn bàn", "Quà sinh nhật", "Sách"]), "shopping");
    if (weekend && r() < 0.28) add(d, k(100, 400), pick(["Vé xem phim", "Karaoke", "Bowling", "Bảo tàng"]), "fun");
    if (r() < 0.04) add(d, k(50, 300), "Nhà thuốc", "health");
  }
  return out;
}

}

/* ================= storage: Claude account (db) → this browser → memory ================= */
const LS_KEY = "tally.ledger.v1";
const Store = {
  col: null, prof: null,
  readLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } },
  writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ expenses: S.expenses, settings: S.settings })); S.backend = "local"; return true; }
    catch { S.backend = "memory"; return false; }
  },
  async init() {
    const saved = this.readLocal();
    if (saved) {
      S.expenses = Array.isArray(saved.expenses) ? saved.expenses : [];
      S.settings = upgradeSettings(saved.settings);
      S.backend = "local";
    } else {
      try { localStorage.setItem(LS_KEY + ".probe", "1"); localStorage.removeItem(LS_KEY + ".probe"); S.backend = "local"; } catch { S.backend = "memory"; }
    }
    S.loaded = true;
    render();
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) return;
      this.prof = db.doc(`data/users/${id}/profile`);
      this.col = this.prof.collection("expenses");
      const browserCopy = S.expenses.slice();
      S.backend = "cloud"; S.loaded = false; render();
      let first = true;
      this.prof.onSnapshot(snap => {
        if (snap.exists) S.settings = upgradeSettings(snap.data());
        Object.keys(fmtCache).forEach(k => delete fmtCache[k]);
        render();
      }, err => this.fail(err));
      this.col.onSnapshot(snap => {
        S.expenses = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        if (first && snap.empty && !snap.metadata.fromCache && browserCopy.length) {
          // first visit with an account: carry over what was saved in this browser
          S.expenses = browserCopy;
          (async () => { for (const e of browserCopy) { await this.put(e); if (!this.col) break; } })();
          toast(`Đã chuyển ${browserCopy.length} khoản chi từ trình duyệt này vào tài khoản Claude của bạn`);
        }
        if (!snap.metadata.fromCache) first = false;
        S.loaded = true;
        render();
      }, err => this.fail(err));
    } catch (e) { this.fail(e); }
  },
  fail(err) {
    if (S.backend !== "cloud") return;
    this.col = null; this.prof = null;
    const ok = this.writeLocal();
    S.loaded = true;
    toast(ok ? "Không kết nối được tài khoản Claude, nên dữ liệu đang được lưu trong trình duyệt này." : "Không lưu được. Thay đổi chỉ giữ đến khi bạn đóng thẻ này.");
    render();
    console.warn("Storage:", err && (err.code || err.message || err));
  },
  async put(e) {
    if (this.col) { try { await this.col.doc(e.id).set(strip(e)); return; } catch (err) { return this.fail(err); } }
    this.writeLocal();
  },
  async remove(id) {
    if (this.col) { try { await this.col.doc(id).delete(); return; } catch (err) { return this.fail(err); } }
    this.writeLocal();
  },
  async putSettings() {
    if (this.prof) { try { await this.prof.set({ ...S.settings }); return; } catch (err) { return this.fail(err); } }
    this.writeLocal();
  },
};
const strip = e => ({ amount: e.amount, note: e.note, cat: e.cat, date: e.date, recurring: !!e.recurring, created: e.created || Date.now() });

async function saveExpense(e) {

/* ================= analysis ================= */
function dailyTotals(list, mk) {
  const n = dim(mk), arr = new Array(n + 1).fill(0);
  for (const e of list) if (e.date.startsWith(mk)) arr[+e.date.slice(8, 10)] += e.amount;
  return arr;
}
function cumulative(daily) { const c = [0]; for (let i = 1; i < daily.length; i++) c[i] = c[i - 1] + daily[i]; return c; }
const totalBudget = () => sum(cats(), c => S.settings.budgets[c.key] || 0);

function detectRecurring(list) {
  const groups = {};
  for (const e of list) { const k = norm(e.note); if (!k) continue; (groups[k] ||= []).push(e); }
  const subs = [];
  for (const [k, items] of Object.entries(groups)) {
    items.sort((a, b) => a.date.localeCompare(b.date));
    const months = new Set(items.map(e => e.date.slice(0, 7)));
    const amts = items.map(e => e.amount).sort((a, b) => a - b), med = amts[Math.floor(amts.length / 2)];
    const days = items.map(e => +e.date.slice(8, 10));
    const flagged = items.some(e => e.recurring);
    const steady = months.size >= 2 && months.size === items.length && amts.every(a => Math.abs(a - med) <= med * 0.15) && Math.max(...days) - Math.min(...days) <= 5;
    if (!flagged && !steady) continue;
    const last = items[items.length - 1], ld = fromYmd(last.date);
    const lastDay = (y, m) => new Date(y, m + 1, 0).getDate();
    let next = new Date(ld.getFullYear(), ld.getMonth() + 1, 1);
    next.setDate(Math.min(ld.getDate(), lastDay(next.getFullYear(), next.getMonth())));
    while (next < today()) { const nm = new Date(next.getFullYear(), next.getMonth() + 1, 1); nm.setDate(Math.min(ld.getDate(), lastDay(nm.getFullYear(), nm.getMonth()))); next = nm; }
    subs.push({ key: k, name: last.note, cat: last.cat, amount: last.amount, next, count: items.length, flagged });
  }
  return subs.sort((a, b) => b.amount - a.amount);
}

function monthStats(mk) {
  const list = all(), t = today(), cur = monthKey(t), n = dim(mk);
  const mine = inMonth(list, mk);
  const daily = dailyTotals(list, mk), cum = cumulative(daily);
  const prevMk = shiftMonth(mk, -1), prevDaily = dailyTotals(list, prevMk), prevCum = cumulative(prevDaily);
  const isCur = mk === cur, isFuture = mk > cur;
  const upto = isCur ? t.getDate() : isFuture ? 0 : n;
  const spent = cum[n];
  const prevN = dim(prevMk);
  const prevAtPoint = prevCum[Math.min(upto, prevN)];
  const budget = totalBudget();
  const subs = detectRecurring(list);
  const subKeys = new Set(subs.map(s => s.key));
  const fixed = e => e.recurring || subKeys.has(norm(e.note));
  let pendingFixed = 0;
  if (isCur) for (const s of subs) {
    const already = mine.some(e => norm(e.note) === s.key);
    if (!already && s.next.getMonth() === t.getMonth() && s.next.getFullYear() === t.getFullYear()) pendingFixed += s.amount;
  }
  const discretionary = sum(mine.filter(e => !fixed(e)), e => e.amount);
  const perDay = upto ? discretionary / upto : 0;
  const projected = isCur ? Math.round(spent + perDay * (n - upto) + pendingFixed) : spent;
  const daysLeft = isCur ? n - upto + 1 : 0;
  const todaySpent = isCur ? daily[upto] : 0;
  const dailyAllowance = isCur ? Math.max(0, (budget - (spent - todaySpent) - pendingFixed) / daysLeft) : 0;
  let noSpend = 0, streak = 0, best = 0, run = 0;
  for (let d = 1; d <= Math.min(upto, n); d++) {
    if (isCur && d === upto) continue;
    if (daily[d] === 0) { noSpend++; run++; best = Math.max(best, run); } else run = 0;
  }
  if (isCur) { for (let d = upto - 1; d >= 1 && daily[d] === 0; d--) streak++; }
  return { mk, n, mine, daily, cum, prevCum, prevN, upto, isCur, isFuture, spent, prevAtPoint, budget, projected, perDay, pendingFixed, daysLeft, dailyAllowance, noSpend, streak, best, subs };
}

let lastHero = null;
function countUp(el, target) {
  const from = lastHero; lastHero = target;
  if (from === null || from === target || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0 = performance.now(), dur = 650;
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = money(Math.round(from + (target - from) * e)); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function niceStep(max, ticks = 4) {
  const raw = max / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}

function drawCumChart(st) {
  const box = $("#cumChart");
  if (!box) return;
  const W = Math.max(280, box.clientWidth || 600), H = 220;
  const m = { l: 52, r: 64, t: 12, b: 26 };
  const n = st.n, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const prevVals = st.prevCum.slice(0, Math.min(st.prevN, n) + 1);
  const maxV = Math.max(st.cum[st.upto] || 0, prevVals[prevVals.length - 1] || 0, st.budget, st.projected, 100);
  const step = niceStep(maxV), top = Math.ceil(maxV / step) * step;
  const x = d => m.l + (d / n) * iw, y = v => m.t + ih - (v / top) * ih;
  const path = vals => vals.map((v, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  let grid = "";
  for (let v = 0; v <= top + 1; v += step) grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${esc(money(v, { compact: true }))}</text>`;
  let xt = "";
  for (const d of [1, 8, 15, 22, n]) xt += `<text x="${x(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`;
  const thisVals = st.cum.slice(0, st.upto + 1);
  const area = st.upto > 0 ? `${path(thisVals)}L${x(st.upto)},${y(0)}L${x(0)},${y(0)}Z` : "";
  let proj = "";
  if (st.isCur && st.upto < n) proj = `<path d="M${x(st.upto)},${y(st.cum[st.upto])}L${x(n)},${y(st.projected)}" stroke="var(--ink)" stroke-width="2" stroke-opacity=".35" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/>
    <text x="${x(n) + 6}" y="${y(st.projected) + 4}" class="endlbl" style="fill:var(--muted)">${esc(money(st.projected, { compact: true }))}</text>`;
  const endV = st.cum[st.upto] || 0;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${grid}${xt}
    <line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule-strong)" stroke-width="1"/>
    ${st.budget > 0 ? `<path d="M${x(0)},${y(0)}L${x(n)},${y(st.budget)}" stroke="var(--c4)" stroke-width="2" fill="none" stroke-linecap="round"/>` : ""}
    <path d="${path(prevVals)}" stroke="var(--muted)" stroke-opacity=".7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    ${area ? `<path d="${area}" fill="var(--ink)" fill-opacity=".07"/>` : ""}
    ${st.upto > 0 ? `<path d="${path(thisVals)}" stroke="var(--ink)" stroke-width="2.25" fill="none" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${proj}
    ${st.upto > 0 ? `<circle cx="${x(st.upto)}" cy="${y(endV)}" r="5" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/>
      ${!(st.isCur && st.upto < n) ? `<text x="${x(st.upto) + 8}" y="${y(endV) + 4}" class="endlbl">${esc(money(endV, { compact: true }))}</text>` : ""}` : ""}
    <line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>
    <rect x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/>
  </svg>`;
  const svg = box.querySelector("svg"), xh = box.querySelector("#xh");
  const base = mkDate(st.mk), prevMk = shiftMonth(st.mk, -1);
  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const d = Math.max(1, Math.min(n, Math.round(((px - m.l) / iw) * n)));
    xh.setAttribute("x1", x(d)); xh.setAttribute("x2", x(d)); xh.setAttribute("visibility", "visible");
    const rows = [];
    if (d <= st.upto) rows.push(`<span class="k" style="background:var(--paper)"></span>${esc(cap(monthWord(st.mk)))} <b>${esc(money(st.cum[d]))}</b>`);
    if (d <= Math.min(st.prevN, n)) rows.push(`<span class="k" style="background:var(--muted)"></span>${esc(cap(monthWord(prevMk)))} <b>${esc(money(st.prevCum[d]))}</b>`);
    if (st.budget > 0) rows.push(`<span class="k" style="background:var(--c4)"></span>Chi đều <b>${esc(money(Math.round(st.budget * d / n)))}</b>`);
    showTip(ev, `<div style="opacity:.7;margin-bottom:2px">${esc(dayLabel(new Date(base.getFullYear(), base.getMonth(), d)))}</div>${rows.join("<br>")}`);
  });
  svg.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); hideTip(); });
}

function renderCalendar(st) {
  const first = mkDate(st.mk), lead = (first.getDay() + 6) % 7;
  const vals = st.daily.slice(1, st.upto + 1).filter(v => v > 0).sort((a, b) => a - b);
  const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0;
  const cuts = [q(.2), q(.4), q(.6), q(.8)];
  const level = v => v <= 0 ? 0 : 1 + cuts.filter(c => v > c).length;
  let html = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) html += `<div class="day pad" aria-hidden="true"></div>`;
  for (let d = 1; d <= st.n; d++) {
    const v = st.daily[d], future = d > st.upto, isToday = st.isCur && d === st.upto;
    const ns = !future && !isToday && v === 0;
    const cls = ["day", `l${level(v)}`, future ? "future" : "", isToday ? "today" : "", ns ? "nospend" : "", S.dayFilter === d ? "sel" : ""].join(" ");
    const val = ns ? `✓ ${esc(money(0, { compact: true }))}` : v ? esc(money(v, { compact: true })) : "";
    const date = new Date(first.getFullYear(), first.getMonth(), d);
    const lbl = `${dayLabel(date)}: ${future ? "chưa tới" : ns ? "không chi tiêu" : money(v)}`;
    html += `<button class="${cls}" data-day="${d}" ${future ? "disabled" : ""} aria-label="${esc(lbl)}" aria-pressed="${S.dayFilter === d}"><span class="d">${d}</span><span class="v">${val}</span></button>`;
  }
  const el = $("#calendar");
  el.innerHTML = `<div class="cal">${html}</div>
    <div class="cal-foot"><span>${st.isFuture ? "Chưa có gì." : `<b>${st.noSpend}</b> ngày không tiêu${st.isCur && st.streak ? ` · chuỗi hiện tại <b>${st.streak}</b> ngày` : ""}${st.best > 1 ? ` · dài nhất <b>${st.best}</b> ngày` : ""}`}</span>
    <span class="ramp" aria-hidden="true">ít <i style="background:var(--paper-2)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><i style="background:var(--h5)"></i> nhiều</span></div>`;
  $("#calSub").textContent = st.isFuture ? "" : "Chạm vào một ngày để xem các khoản chi";
  el.querySelectorAll(".day[data-day]").forEach(b => {
    b.addEventListener("click", () => { const d = +b.dataset.day; S.dayFilter = S.dayFilter === d ? null : d; render(); });
    b.addEventListener("pointerenter", ev => {
      const d = +b.dataset.day; if (d > st.upto) return;
      const items = st.mine.filter(e => +e.date.slice(8, 10) === d).sort((a, b) => b.amount - a.amount);
      const top = items.slice(0, 3).map(e => `${esc(label(e))} <b>${esc(money(e.amount))}</b>`).join("<br>");
      showTip(ev, `<div style="opacity:.7">${esc(dayLabel(new Date(first.getFullYear(), first.getMonth(), d)))}</div>${items.length ? `<b>${esc(money(st.daily[d]))}</b> · ${items.length} khoản chi<br>${top}${items.length > 3 ? "<br>…" : ""}` : "Không chi tiêu"}`);
    });
    b.addEventListener("pointerleave", hideTip);
  });
}

function renderLedger(st) {
  const q = norm(S.query);
  let rows = st.mine.slice();
  if (S.dayFilter) rows = rows.filter(e => +e.date.slice(8, 10) === S.dayFilter);
  if (q) rows = rows.filter(e => norm(e.note).includes(q) || norm(catName(e.cat)).includes(q));
  rows.sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
  const df = $("#dayFilter");
  if (S.dayFilter) {
    const d = new Date(mkDate(st.mk).getFullYear(), mkDate(st.mk).getMonth(), S.dayFilter);
    df.innerHTML = `<button class="chip plain" id="clearDay" aria-label="Bỏ lọc theo ngày">${esc(shortDate(d))} ✕</button>`;
    $("#clearDay").onclick = () => { S.dayFilter = null; render(); };
  } else df.innerHTML = "";
  const el = $("#ledger");
  if (!rows.length) {
    el.innerHTML = `<p class="empty">${st.mine.length ? "Không có khoản chi nào khớp." : st.isFuture ? "Tháng này chưa bắt đầu." : "Tháng này chưa ghi gì. Gõ thử “đi chợ 250k” vào ô phía trên."}</p>`;
    return;
  }
  const groups = [];
  for (const e of rows) { const g = groups[groups.length - 1]; if (g && g.date === e.date) g.items.push(e); else groups.push({ date: e.date, items: [e] }); }
  el.innerHTML = groups.map(g => `<div class="daygroup"><div class="dayhead"><span>${esc(dayLabel(fromYmd(g.date)))}</span><span class="num">${esc(money(sum(g.items, e => e.amount)))}</span></div>
      ${g.items.map(e => `<button class="row${e.id === S.flashId ? " flash" : ""}" data-id="${esc(e.id)}" aria-label="Sửa ${esc(label(e))}, ${esc(money(e.amount))}">
        <span class="note">${esc(label(e))}</span>
        <span class="amt">${esc(money(e.amount))}</span>
        <span class="meta"><span class="dot" style="background:${catColor(e.cat)}"></span>${esc(catName(e.cat))}${e.recurring ? `<span class="tagpill">Hàng tháng</span>` : ""}</span>
      </button>`).join("")}</div>`).join("");
  el.querySelectorAll(".row").forEach(b => b.addEventListener("click", () => startEdit(b.dataset.id)));
}

// the money you have for a month; a month you haven't filled in carries over the latest earlier one
function fundsFor(mk) {
  const f = S.settings.funds || {};
  const from = f[mk] ? mk : Object.keys(f).filter(k => k < mk).sort().pop();
  return from ? { cents: f[from], from } : null;
}
function renderWallet(st) {
  const el = $("#wallet");
  const fund = fundsFor(st.mk);
  let body = `<p class="empty">Nhập số tiền bạn có trong ${esc(monthWord(st.mk))} (lương, tiền tiêu vặt…) để xem còn lại bao nhiêu sau khi chi tiêu.</p>`;
  if (fund) {
    const have = fund.cents, left = have - st.spent;
    const pct = st.spent / have, sev = pct > 1 ? "crit" : pct > 0.85 ? "warn" : "";
    const afterBills = left - st.pendingFixed;
    const perDay = st.isCur ? Math.max(0, (afterBills + st.daily[st.upto]) / st.daysLeft) : 0;
    body = `<div class="eyebrow">${left >= 0 ? "Còn lại sau khi chi" : "Đã tiêu quá số tiền có"}</div>
      <div class="big-num num${left < 0 ? " over" : ""}" aria-live="polite">${esc(wholeMoney(Math.abs(left)))}</div>
      <div class="meter" role="meter" aria-label="Đã chi ${esc(money(st.spent))} trên ${esc(money(have))}" aria-valuemin="0" aria-valuemax="${have / 100}" aria-valuenow="${st.spent / 100}"><b class="${sev}" style="width:${Math.min(100, pct * 100).toFixed(1)}%"></b></div>
      <dl class="traits">
        <div><dt>Tiền có</dt><dd class="num">${esc(money(have, { compact: true }))}</dd></div>
        <div><dt>Đã chi</dt><dd class="num">${esc(money(st.spent, { compact: true }))}</dd></div>
        <div><dt>${st.isCur ? "Mỗi ngày còn" : "Đã dùng"}</dt><dd class="num">${st.isCur ? esc(money(perDay, { compact: true })) : `${Math.round(pct * 100)}%`}</dd></div>
      </dl>
      ${st.isCur && st.pendingFixed > 0 ? `<p class="fine">Còn ${esc(money(st.pendingFixed))} hóa đơn định kỳ sắp tới trong tháng, trừ xong còn <b>${esc(wholeMoney(afterBills))}</b>.</p>` : ""}
      ${fund.from !== st.mk ? `<p class="fine">Đang dùng số tiền bạn nhập cho ${esc(monthWord(fund.from))}. Nhập số mới nếu ${esc(monthWord(st.mk))} khác.</p>` : ""}`;
  }
  el.innerHTML = `<div class="panel-head"><h2>Tiền còn lại</h2><span class="sub">${esc(monthLabel(st.mk))}</span></div>
    <form class="wallet-in" id="walletForm" autocomplete="off">
      <label for="walletAmt">Số tiền bạn có trong ${esc(monthWord(st.mk))}</label>
      <input id="walletAmt" type="text" inputmode="decimal" placeholder="VD: 15tr" value="${fund ? esc(amountToField(fund.cents)) : ""}">
      <button class="btn" type="submit">Lưu</button>
    </form>${body}`;
  $("#walletForm").onsubmit = ev => {
    ev.preventDefault();
    const raw = $("#walletAmt").value.trim(), funds = { ...S.settings.funds };
    if (!raw) delete funds[st.mk];
    else {
      const cents = parseAmount(raw);
      if (!cents) { toast("Không hiểu số tiền này. Thử nhập 15tr hoặc 15.000.000."); $("#walletAmt").focus(); return; }
      funds[st.mk] = cents;
    }
    S.settings.funds = funds;
    saveSettings();
    toast(raw ? `Đã lưu số tiền cho ${monthWord(st.mk)}` : `Đã xóa số tiền của ${monthWord(st.mk)}`);
  };
}

function renderEnvelopes(st) {
  const el = $("#envelopes");
  const frac = st.isCur ? st.upto / st.n : 1;
  const byCat = {};
  for (const e of st.mine) { const k = activeKey(e.cat); byCat[k] = (byCat[k] || 0) + e.amount; }
  const rows = cats(true).map(c => {
    const spent = byCat[c.key] || 0, bud = c.hidden ? 0 : S.settings.budgets[c.key] || 0;
    if (!spent && !bud) return "";
    const pct = bud ? spent / bud : spent ? 2 : 0;
    const sev = pct > 1 ? "crit" : pct > 0.85 ? "warn" : "";
    let note = "";
    if (pct > 1) note = `<span class="env-note crit">▲ Vượt ${esc(money(spent - bud))}</span>`;
    else if (st.isCur && st.upto >= 7 && bud && pct <= 0.85 && spent > bud * frac * 1.25 && spent > PACE_MIN()) note = `<span class="env-note warn">Đang tiêu nhanh hơn tốc độ của tháng</span>`;
    return `<div class="env-row">
      <span class="env-name"><span class="dot" style="background:${c.color}"></span>${esc(catName(c.key))}</span>
      <span class="env-val">${esc(money(spent, { compact: true }))} <span style="color:var(--muted)">/ ${bud ? esc(money(bud, { compact: true })) : "chưa đặt"}</span></span>
      <div class="meter" role="meter" aria-label="${esc(catName(c.key))}: đã chi ${esc(money(spent))} trên ${esc(money(bud))}" aria-valuemin="0" aria-valuemax="${bud / 100}" aria-valuenow="${spent / 100}"><b class="${sev}" style="width:${Math.min(100, pct * 100).toFixed(1)}%"></b>${st.isCur && bud ? `<span class="pacemark" style="left:calc(${(frac * 100).toFixed(1)}% - 1px)" title="Mức nên chi đến hôm nay nếu chi đều"></span>` : ""}</div>
      ${note}</div>`;
  }).join("");
  const left = st.budget - st.spent;
  el.innerHTML = `<div class="panel-head"><h2>Hũ chi tiêu</h2><button class="link" id="editBudgets">Sửa ngân sách</button></div>
    <div class="env">${rows || `<p class="empty">Đặt ngân sách hàng tháng cho từng hũ để xem mỗi hũ còn bao nhiêu.</p>`}</div>
    <div class="env-total"><span>${st.isCur ? "Vạch đen là mức nên chi đến hôm nay nếu chi đều." : "Tháng đã khép lại."}</span><span class="num"><b>${esc(wholeMoney(Math.abs(left)))}</b> ${left >= 0 ? "còn lại" : "vượt mức"}</span></div>`;
  $("#editBudgets").onclick = openSettings;
}

function renderRadar(st) {

    <div class="radar-list">${subs.slice(0, 7).map(s => `<div class="radar-row">

/* ================= tooltip & toast ================= */
const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY - h - 12;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y < 8) y = ev.clientY + 16;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.hidden = true; }
let toastTimer;
function toast(msg, action, fn) {
  const t = $("#toast"), b = $("#toastBtn");
  $("#toastMsg").textContent = msg;
  b.hidden = !action; b.textContent = action || "";
  b.onclick = () => { t.hidden = true; fn && fn(); };
  t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, action ? 6000 : 4000);
}

/* ================= the printer band (add / edit) ================= */
const F = { amount: $("#fAmount"), cat: $("#fCat"), date: $("#fDate"), note: $("#fNote"), rec: $("#fRec") };
const defaultCat = () => (catInfo("other") ? "other" : "");
const fillCats = () => {
  const v = F.cat.value;
  F.cat.innerHTML = (catInfo("other") ? "" : `<option value="" disabled>Chọn danh mục</option>`) + cats().map(c => `<option value="${c.key}">${esc(catName(c.key))}</option>`).join("");
  F.cat.value = v && catInfo(v) ? v : defaultCat();
};
fillCats();
const DEFAULT_MSG = "Các ô sẽ tự điền khi bạn gõ. Bạn có thể sửa bất kỳ ô nào trước khi thêm.";
function resetForm() {
  S.editing = null; S.touched.clear();
  $("#quick").value = "";
  F.amount.value = ""; F.cat.value = defaultCat(); F.date.value = ymd(today()); F.note.value = ""; F.rec.checked = false;
  document.querySelectorAll(".fld.auto").forEach(f => f.classList.remove("auto"));
  $("#slot").classList.remove("editing");
  $("#editActions").hidden = true;
  $("#addBtn").textContent = "Thêm";
  $("#slotTitle").textContent = "Ghi khoản chi như cách bạn nói";
  setMsg(DEFAULT_MSG);
}
function setMsg(t, err = false) { const m = $("#slotMsg"); m.textContent = t; m.classList.toggle("err", err); }
function onQuick() {
  const p = parseQuick($("#quick").value, today(), S.expenses.slice().reverse());
  const mark = (k, on) => document.querySelector(`.fld[data-f="${k}"]`).classList.toggle("auto", on);
  if (!S.touched.has("amount")) { F.amount.value = p.amount ? amountToField(p.amount) : ""; mark("amount", !!p.amount); }
  if (!S.touched.has("cat")) { F.cat.value = p.cat || defaultCat(); mark("cat", !!p.cat); }
  if (!S.touched.has("date")) { F.date.value = p.date || ymd(today()); mark("date", !!p.date); }
  if (!S.touched.has("note")) { F.note.value = p.note; mark("note", !!p.note); }
  if (!S.touched.has("rec")) F.rec.checked = p.recurring;
  if (!$("#quick").value.trim()) setMsg(DEFAULT_MSG);
  else if (!p.amount && !S.touched.has("amount")) setMsg("Thêm số tiền, ví dụ 45k, rồi nhấn Enter.");
  else setMsg(`Nhấn Enter để thêm ${p.note ? `“${p.note}”` : "khoản này"}${p.cat ? ` vào mục ${catName(p.cat)}` : ""}.${p.guessed ? ` Đã hiểu là ${money(p.amount)}.` : ""}`);
}
for (const [k, el] of Object.entries(F)) el.addEventListener("input", () => { S.touched.add(k); el.closest(".fld")?.classList.remove("auto"); });
$("#quick").addEventListener("input", onQuick);
$("#feedForm").addEventListener("submit", ev => { ev.preventDefault(); commit(); });
for (const el of [F.amount, F.note, F.date]) el.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); commit(); } });

function commit() {
  const amount = parseAmount(F.amount.value);
  if (!amount) { setMsg("Hãy nhập số tiền, ví dụ 45k, để ghi lại khoản chi.", true); F.amount.focus(); return; }
  if (!F.cat.value) { setMsg("Hãy chọn danh mục cho khoản chi này.", true); F.cat.focus(); return; }
  const date = F.date.value || ymd(today());
  if (date > ymd(today())) { setMsg("Ngày này ở tương lai. Hãy chọn hôm nay hoặc trước đó.", true); F.date.focus(); return; }
  const base = S.editing ? S.expenses.find(e => e.id === S.editing) : null;
  const e = { id: base ? base.id : uid(), amount, cat: F.cat.value, date, note: F.note.value.trim(), recurring: F.rec.checked, created: base ? base.created : Date.now() };
  const firstEver = !S.expenses.length;
  saveExpense(e);
  if (e.date.slice(0, 7) !== S.view) { S.view = e.date.slice(0, 7); S.dayFilter = null; render(); }
  resetForm();
  toast(base ? "Đã lưu thay đổi" : firstEver ? "Đã ghi khoản chi đầu tiên. Sổ mẫu đã biến mất, giờ đây là sổ của bạn." : `Đã thêm ${money(amount)}${e.note ? ` cho ${e.note}` : ""}`);
  $("#quick").focus();
}
function startEdit(id) {
  if (usingSample()) { toast("Đây là dữ liệu mẫu. Hãy thêm khoản chi của bạn ở trên để bắt đầu."); $("#quick").focus(); return; }
  const e = S.expenses.find(x => x.id === id);
  if (!e) return;
  resetForm();
  S.editing = id;
  ["amount", "cat", "date", "note", "rec"].forEach(k => S.touched.add(k));
  F.amount.value = amountToField(e.amount); F.cat.value = e.cat; F.date.value = e.date; F.note.value = e.note; F.rec.checked = !!e.recurring;
  $("#slot").classList.add("editing");
  $("#editActions").hidden = false;
  $("#addBtn").textContent = "Lưu";
  $("#slotTitle").textContent = `Đang sửa “${label(e)}”`;
  setMsg("Sửa bất kỳ ô nào rồi nhấn Lưu.");
  $("#slot").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  F.amount.focus({ preventScroll: true });
}
$("#cancelBtn").onclick = resetForm;
$("#delBtn").onclick = () => { const id = S.editing; resetForm(); deleteExpense(id); };

/* ================= month nav, search ================= */
const go = n => { const t = shiftMonth(S.view, n); if (t > monthKey(today())) return; S.view = t; S.dayFilter = null; hideTip(); render(); };
$("#prevM").onclick = () => go(-1);
$("#nextM").onclick = () => go(1);
