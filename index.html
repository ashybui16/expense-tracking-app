/* ================= modal: settings ================= */
function openModal(html, onOpen) {
  const m = $("#modal");
  m.innerHTML = html; m.hidden = false;
  m.onclick = ev => { if (ev.target === m) closeModal(); };
  onOpen && onOpen(m);
}
function closeModal() { const m = $("#modal"); m.hidden = true; m.innerHTML = ""; }

function openSettings() {
  const b = S.settings.budgets, step = zeroDec() ? 50000 : 1;
  const catRow = c => `<div class="bud-cell" data-key="${esc(c.key)}"${c.hue ? ` data-hue="${c.hue}"` : ""}>
      <span class="bud-name"><span class="dot" style="background:${c.color}"></span><input type="text" class="cn" maxlength="30" placeholder="${esc(c.custom ? "Tên danh mục" : c.name)}" value="${esc(c.custom ? c.name : S.settings.catNames?.[c.key] || "")}" aria-label="Tên danh mục${c.name ? ` ${esc(c.name)}` : " mới"}">${`<button type="button" class="icon-btn sm cat-del" aria-label="Xóa danh mục ${esc(c.name ? catName(c.key) : "mới")}" title="Xóa danh mục">✕</button>`}</span>
      <input type="number" class="cb" min="0" step="${step}" inputmode="numeric" value="${Math.round((b[c.key] || 0) / 100)}" aria-label="Ngân sách hàng tháng cho ${esc(c.name ? catName(c.key) : "danh mục mới")}"></div>`;
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Ngân sách &amp; cài đặt</h2>
    <p class="sub" style="margin:0">Đặt tên và ngân sách hàng tháng cho từng hũ (${esc(S.settings.currency)}). Để 0 nếu chỉ muốn theo dõi mà không giới hạn.</p>
    <div class="sec"><div class="bud-grid" id="budGrid">${cats().map(catRow).join("")}</div>
      <div style="display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" id="addCat">+ Thêm danh mục</button><button type="button" class="link" id="addOther"${catInfo("other") ? " hidden" : ""}>Hiện lại “${esc(catName("other"))}”</button><span class="fine" id="catMsg" style="margin:0" aria-live="polite"></span></div></div>
    <div class="sec"><h3>Tiền tệ</h3><select id="curSel" aria-label="Tiền tệ">${CURRENCIES.map(c => `<option${c === S.settings.currency ? " selected" : ""}>${c}</option>`).join("")}</select>
      <p class="fine" style="margin:0">Chỉ đổi ký hiệu tiền. Số tiền không được quy đổi tỷ giá.</p></div>
    <div class="sec"><h3>Dữ liệu của bạn</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn" id="sampleTgl">${S.settings.hideSample ? "Hiện sổ mẫu khi chưa có dữ liệu" : "Ẩn sổ mẫu"}</button>
        <button class="btn danger" id="eraseBtn"${S.expenses.length ? "" : " disabled"}>Xóa toàn bộ ${S.expenses.length} khoản chi</button>
      </div><span class="fine" id="eraseMsg" style="margin:0"></span></div>
    <div class="sheet-actions"><button class="btn" id="setCancel">Hủy</button><button class="btn solid" id="setSave">Lưu</button></div>
  </div>`, m => {
    const grid = $("#budGrid", m);
    $(".cb", grid).focus();
    // removals only take effect on Lưu; Hủy keeps every category
    const removed = new Set();
    const showRemoved = () => {
      const n = S.expenses.filter(e => removed.has(e.cat) && e.cat !== "other").length;
      $("#catMsg", m).textContent = removed.size ? `Sẽ xóa ${removed.size} danh mục khi lưu${n ? `. ${n} khoản chi trong đó sẽ chuyển sang “${catName("other")}”` : ""}.${removed.has("other") ? ` “${catName("other")}” chỉ hiện ở hũ chi tiêu khi có khoản chi nằm trong đó.` : ""}` : "";
      $("#addOther", m).hidden = !!grid.querySelector('[data-key="other"]');
    };
    grid.addEventListener("click", ev => {
      const del = ev.target.closest(".cat-del");
      if (!del) return;
      const row = del.closest(".bud-cell");
      if (catInfo(row.dataset.key)) removed.add(row.dataset.key);
      row.remove(); showRemoved();
    });
    $("#addCat", m).onclick = () => {
      const key = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      // the first palette color no category in the dialog is using, so new categories stand apart while colors last
      const used = [...grid.querySelectorAll(".bud-cell")].map(r => +r.dataset.hue || +(catInfo(r.dataset.key)?.color.match(/\d+/)?.[0]));
      const hue = [1, 2, 3, 4, 5, 6, 7, 8].find(h => !used.includes(h)) || hueOf(key);
      const other = grid.querySelector('[data-key="other"]');
      const html = catRow({ key, name: "", hue, color: `var(--c${hue})`, custom: true });
      if (other) other.insertAdjacentHTML("beforebegin", html); else grid.insertAdjacentHTML("beforeend", html);
      const row = other ? other.previousElementSibling : grid.lastElementChild;
      row.scrollIntoView({ block: "nearest" });
      $(".cn", row).focus();
    };
    $("#addOther", m).onclick = () => {
      grid.insertAdjacentHTML("beforeend", catRow(CAT.other));
      removed.delete("other"); showRemoved();
      $(".cb", grid.lastElementChild).focus();
    };
    $("#setCancel", m).onclick = closeModal;
    $("#setSave", m).onclick = async () => {
      const nb = {}, nn = {}, own = [], kept = new Set();
      for (const row of grid.querySelectorAll(".bud-cell")) {
        const k = row.dataset.key, name = $(".cn", row).value.trim().slice(0, 30), v = Number($(".cb", row).value);
        if (CAT[k]) { if (name && name !== CAT[k].name) nn[k] = name; }
        else {
          const prev = catInfo(k);
          if (!name && !prev) continue; // a new row left blank
          own.push({ key: k, name: name || prev.name, hue: +row.dataset.hue || prev?.hue || hueOf(k) });
        }
        kept.add(k);
        nb[k] = isFinite(v) && v > 0 ? Math.round(v * 100) : 0;
      }
      if (!kept.size) { $("#catMsg", m).textContent = "Cần giữ lại ít nhất một danh mục."; return; }
      const moved = S.expenses.filter(e => e.cat !== "other" && removed.has(e.cat) && !kept.has(e.cat));
      S.settings.budgets = nb; S.settings.catNames = nn; S.settings.customCats = own;
      S.settings.hiddenCats = CATS.filter(c => !kept.has(c.key)).map(c => c.key);
      S.settings.currency = $("#curSel", m).value; S.settings.v = SETTINGS_VERSION;
      closeModal(); saveSettings();
      toast(moved.length ? `Đã lưu. ${moved.length} khoản chi đã chuyển sang “${catName("other")}”.` : "Đã lưu ngân sách và danh mục");
      for (const e of moved) { e.cat = "other"; await Store.put(e); }
      if (moved.length) render();
    };
    $("#sampleTgl", m).onclick = () => { S.settings.hideSample = !S.settings.hideSample; closeModal(); saveSettings(); };
    let armed = false;
    $("#eraseBtn", m).onclick = async ev => {
      if (!armed) { armed = true; ev.target.textContent = `Có, xóa vĩnh viễn ${S.expenses.length} khoản chi`; $("#eraseMsg", m).textContent = "Không thể hoàn tác. Hãy xuất CSV trước nếu bạn có thể cần lại chúng."; return; }
      const ids = S.expenses.map(e => e.id);
      S.expenses = []; closeModal(); render();
      for (const id of ids) await Store.remove(id);
      toast("Đã xóa toàn bộ khoản chi");
    };
  });
}
$("#settingsBtn").onclick = openSettings;

/* ================= modal: the month's receipt ================= */
const UP = s => String(s).toLocaleUpperCase(LOCALE);
function openReceipt() {
  const st = monthStats(S.view);
  const byCat = cats(true).map(c => ({ c, items: st.mine.filter(e => activeKey(e.cat) === c.key).sort((a, b) => b.amount - a.amount) })).filter(g => g.items.length);
  const counts = {};
  for (const e of st.mine) { const k = label(e); counts[k] = (counts[k] || 0) + 1; }
  const frequent = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const biggest = st.mine.reduce((a, b) => (!a || b.amount > a.amount ? b : a), null);
  const change = st.budget - st.spent;
  const now = new Date();
  let seed = 0; for (const ch of st.mk + st.spent) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
  const rr = rng(seed);
  const bars = Array.from({ length: 46 }, () => `<i style="width:${1 + Math.floor(rr() * 3)}px;margin-right:${1 + Math.floor(rr() * 2)}px"></i>`).join("");
  const L = (a, b, cls = "") => `<div class="ln ${cls}"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
  const body = !st.mine.length ? `<div class="c">THÁNG NÀY KHÔNG CÓ KHOẢN CHI</div>` : byCat.map(g =>
    L(UP(catName(g.c.key)), money(sum(g.items, e => e.amount))) +
    g.items.slice(0, 3).map(e => L(label(e), money(e.amount), "sm")).join("") +
    (g.items.length > 3 ? L(`+ ${g.items.length - 3} khoản khác`, "", "sm") : "")).join("");
  openModal(`<div class="printer" role="dialog" aria-modal="true" aria-label="Biên lai ${esc(monthLabel(st.mk).toLowerCase())}">
    <div class="printer-mouth"></div>
    <div class="paper-feed"><div class="receipt" id="receipt">
      <div class="c big">SỔ CHI TIÊU</div>
      <div class="c">SAO KÊ CHI TIÊU</div>
      <div class="c">${esc(UP(monthLabel(st.mk)))}</div>
      <hr class="hr">
      ${body}
      <hr class="hr">
      ${L("SỐ KHOẢN", String(st.mine.length))}
      ${L("TẠM TÍNH", money(st.spent), "tot")}
      ${st.budget ? L("NGÂN SÁCH ĐƯA", money(st.budget)) : ""}
      ${st.budget ? L(change >= 0 ? "TIỀN THỐI LẠI" : "CÒN NỢ", money(Math.abs(change)), "tot") : ""}
      <hr class="hr">
      ${L("NGÀY KHÔNG TIÊU", String(st.noSpend))}
      ${biggest ? L("CHI ĐẬM NHẤT", label(biggest)) : ""}
      ${frequent ? L("MÓN RUỘT", `${frequent[0]} ×${frequent[1]}`) : ""}
      <div class="barcode" aria-hidden="true">${bars}</div>
      <div class="c" style="font-size:11px">${esc(st.mk.replace("-", ""))}-${String(Math.abs(seed) % 100000).padStart(5, "0")}</div>
      <hr class="hr">
      <div class="c">${change >= 0 ? "*** CẢM ƠN BẠN ĐÃ TIÊU KHÉO ***" : "*** CẢM ƠN. HẸN GẶP LẠI (ÍT HƠN NHÉ) ***"}</div>
      <div class="c" style="font-size:11px;color:#5b5e66">IN LÚC ${esc(`${pad(now.getHours())}:${pad(now.getMinutes())} ${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`)}${usingSample() ? " · DỮ LIỆU MẪU" : ""}</div>
    </div></div>
    <div class="receipt-actions"><button class="btn" id="copyRc">Sao chép dạng chữ</button><button class="btn" id="reprint">In lại</button><button class="btn solid" id="closeRc">Đóng</button></div>
  </div>`, m => {
    $("#closeRc", m).onclick = closeModal;
    $("#closeRc", m).focus();
    $("#reprint", m).onclick = () => { const r = $("#receipt", m); r.style.animation = "none"; void r.offsetWidth; r.style.animation = ""; };
    $("#copyRc", m).onclick = async () => {
      const line = n => {
        const [a, b] = n.querySelectorAll("span"), sm = n.classList.contains("sm"), s = (sm ? "  " : "") + a.textContent, v = b.textContent;
        return s + " ".repeat(Math.max(1, 34 - s.length - v.length)) + v;
      };
      const txt = [...$("#receipt", m).children].map(n => n.classList.contains("hr") ? "-".repeat(34) : n.classList.contains("barcode") ? "" : n.classList.contains("ln") ? line(n) : n.textContent.trim()).filter(Boolean).join("\n");
      try { await navigator.clipboard.writeText(txt); toast("Đã sao chép biên lai"); }
      catch { const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents($("#receipt", m)); sel.removeAllRanges(); sel.addRange(rg); toast("Đã chọn biên lai. Nhấn Ctrl+C hoặc ⌘C để sao chép."); }
    };
  });
}
$("#receiptBtn").onclick = openReceipt;

/* ================= CSV export / import ================= */
function toCSV(list) {
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const rows = [["ngay", "so_tien", "tien_te", "danh_muc", "ghi_chu", "lap_lai_hang_thang"]];
  for (const e of list.slice().sort((a, b) => a.date.localeCompare(b.date))) rows.push([e.date, zeroDec() ? String(Math.round(e.amount / 100)) : (e.amount / 100).toFixed(2), S.settings.currency, catName(e.cat), e.note, e.recurring ? "có" : "không"]);
  return "﻿" + rows.map(r => r.map(q).join(",")).join("\n") + "\n"; // BOM so Excel reads Vietnamese correctly
}
$("#exportBtn").onclick = async () => {
  if (!S.expenses.length) { toast(usingSample() ? "Chưa có gì để xuất. Sổ mẫu không phải dữ liệu của bạn." : "Chưa có gì để xuất."); return; }
  const data = toCSV(S.expenses), filename = `so-chi-tieu-${ymd(today())}.csv`;
  const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data }); toast("Đã lưu tệp xuất"); } catch (err) { if (err && err.code !== "declined") toast("Không xuất được ở đây. Hãy thử lại sau giây lát."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "text/csv;charset=utf-8" })); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Đã xuất ${S.expenses.length} khoản chi`);
};
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
$("#importLbl").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#importFile").click(); } });
$("#importFile").addEventListener("change", async ev => {
  const file = ev.target.files[0]; ev.target.value = "";
  if (!file) return;
  const rows = parseCSV(await file.text());
  if (rows.length < 2) { toast("Tệp này không có dòng nào để nhập."); return; }
  const head = rows[0].map(h => norm(h));
  const col = names => head.findIndex(h => names.some(n => h.includes(n)));
  const iD = col(["ngay", "date"]), iA = col(["so tien", "thanh tien", "amount", "cost", "price", "total"]), iC = col(["danh muc", "loai", "category"]);
  const iN = col(["ghi chu", "mo ta", "noi dung", "note", "description", "memo", "merchant"]), iR = col(["lap lai", "dinh ky", "repeat", "recurring"]);
  if (iD < 0 || iA < 0) { toast("Không tìm thấy cột “ngày” và “số tiền” trong tệp."); return; }
  const seen = new Set(S.expenses.map(e => `${e.date}|${e.amount}|${norm(e.note)}`));
  const added = [];
  for (const r of rows.slice(1)) {
    const amount = parseAmount(r[iA], false); let date = (r[iD] || "").trim(), m;
    if ((m = date.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) date = ymd(new Date(+m[3], +m[2] - 1, +m[1]));
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { const d = new Date(date); if (isNaN(d)) continue; date = ymd(d); }
    if (!amount) continue;
    const note = iN >= 0 ? (r[iN] || "").trim() : "";
    const cname = iC >= 0 ? norm(r[iC]) : "";
    const cat = cats().find(c => norm(c.name) === cname || norm(catName(c.key)) === cname || c.key === cname)?.key || parseQuick(note || cname).cat || "other";
    const k = `${date}|${amount}|${norm(note)}`; if (seen.has(k)) continue; seen.add(k);
    added.push({ id: uid(), amount, date, note, cat, recurring: iR >= 0 && /^(y|yes|true|1|co)$/i.test(fold((r[iR] || "").trim())), created: Date.now() });
  }
  if (!added.length) { toast("Không có gì mới để nhập. Các khoản này đã có sẵn."); return; }
  S.expenses.push(...added); render();
  toast(`Đang nhập ${added.length} khoản chi…`);
  if (Store.col) { for (const e of added) { await Store.put(e); if (!Store.col) break; } } else Store.writeLocal();
  toast(`Đã nhập ${added.length} khoản chi`);
});

/* ================= keyboard + resize ================= */
document.addEventListener("keydown", ev => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (ev.key === "Escape") { if (!$("#modal").hidden) closeModal(); else if (S.editing) resetForm(); else if (typing) document.activeElement.blur(); return; }
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey || !$("#modal").hidden) return;
  if (ev.key === "/" || ev.key === "n") { ev.preventDefault(); $("#quick").focus(); }
  else if (ev.key === "[") go(-1);
  else if (ev.key === "]") go(1);
  else if (ev.key === "r") openReceipt();
});
let rzT;
new ResizeObserver(() => { clearTimeout(rzT); rzT = setTimeout(() => drawCumChart(monthStats(S.view)), 120); }).observe($("#summary"));

/* ================= rotating placeholder ================= */
const EXAMPLES = ["bún chả 55k thứ 6 #ăn", "đi chợ 320k hôm qua", "grab 38k tối qua", "netflix 260k hàng tháng", "vé xem phim 190k ngày 3/10", "cà phê sữa đá 29k", "tiền nhà 6tr5 hàng tháng"];
let exI = 0;
setInterval(() => { const q = $("#quick"); if (document.activeElement !== q && !q.value) q.placeholder = EXAMPLES[exI = (exI + 1) % EXAMPLES.length]; }, 4000);

/* ================= boot ================= */
resetForm();
Store.init();
